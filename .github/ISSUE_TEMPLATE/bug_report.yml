name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please do not file them here — use the private report link in the next tab ("Security policy").
        **Never paste** API keys, your `~/.memvaultrc.json`, vault contents or secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. memvault import chatgpt export.zip
        2. ...
  - type: input
    id: version
    attributes:
      label: MemVault version
      description: Output of `memvault --version` (or `npx -y @mrchartist/memvault --version`)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, WSL]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [MCP server / tools, Dashboard, Agents, Capture (sync), Importer, Backup / Google Drive, MCP bridge, Setup / CLI, Other]
  - type: textarea
    id: doctor
    attributes:
      label: Output of `memvault doctor`
      description: Optional but very helpful. Read it first and remove anything you do not want to share (it can include folder names).
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
