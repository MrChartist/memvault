name: Feature request
description: Suggest an improvement or a new capture engine / importer
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: For new capture engines — what data would be stored, and could it contain secrets? (New sensitive engines must be opt-in.)
