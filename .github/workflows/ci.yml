name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x]
        include:
          - os: windows-latest
            node-version: 22.x
          - os: macos-latest
            node-version: 22.x

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sanity checks (syntax, versions, no personal paths)
        run: npm run check

      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Pack and smoke-test the tarball
        run: |
          npm pack --json > pack.json
          TARBALL=$(node -p "require('./pack.json')[0].filename")
          # nothing private or heavy may ship
          if tar -tzf "$TARBALL" | grep -E '^package/(tests/|\.github/|docs/images/|.*\.sqlite|\.env)'; then
            echo "Unexpected files in the package"; exit 1
          fi
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/memvault --version
          VAULT_ROOT="$RUNNER_TEMP/vault" ./node_modules/.bin/memvault vault diary "ci smoke test"
          VAULT_ROOT="$RUNNER_TEMP/vault" ./node_modules/.bin/memvault vault search "smoke"
