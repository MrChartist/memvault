name: Website

# Publishes the product page in site/ to GitHub Pages (https://mrchartist.github.io/memvault/).
# Runs when site/ changes on main, or by hand from the Actions tab.
# One-time setup by the owner: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until that is switched on, the deploy step fails with "Get Pages site failed". See docs/website.md.
on:
  push:
    branches: [ main ]
    paths: [ 'site/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
